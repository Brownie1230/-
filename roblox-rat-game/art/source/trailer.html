// ---------- helpers ----------
const mat = (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:0.45, metalness:0}, o));
function add(m,p){ m.castShadow=true; m.receiveShadow=true; p.add(m); return m; }
function ell(sx,sy,sz,c,p){ const m=add(new THREE.Mesh(new THREE.SphereGeometry(1,40,28),mat(c)),p); m.scale.set(sx,sy,sz); return m; }
function ball(r,c,p,o){ return add(new THREE.Mesh(new THREE.SphereGeometry(r,28,20),mat(c,o)),p); }
function cyl(r,h,c,p,o){ return add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,40),mat(c,o)),p); }
function rbox(w,h,d,c,p,rad=0.12){ return add(new THREE.Mesh(new RoundedBoxGeometry(w,h,d,4,rad),mat(c)),p); }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const backOut=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function rng(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

// ---------- environment (restaurant) ----------
function makeEnv(scene, opts={}){
  scene.background = new THREE.Color(opts.bg||0x1b1020);
  scene.fog = new THREE.Fog(opts.bg||0x1b1020, 22, 60);
  const hemi = new THREE.HemisphereLight(0xffe6c8, 0x3a2030, 1.0); scene.add(hemi);
  const key = new THREE.SpotLight(0xffd9a0, 900, 60, 0.75, 0.5, 1.6); key.position.set(4,16,-6); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key); scene.add(key.target);
  const rim = new THREE.DirectionalLight(0x8fb4ff, 1.4); rim.position.set(-8,8,12); scene.add(rim);
  const g = new THREE.Group(); scene.add(g);
  for(let i=-9;i<9;i++) for(let j=-6;j<8;j++){ const t=new THREE.Mesh(new THREE.BoxGeometry(2,0.2,2), mat(((i+j)&1)?0xeadcc4:0xa93f36,{roughness:0.6})); t.position.set(i*2+1,-0.1,j*2+1); t.receiveShadow=true; g.add(t); }
  const wall = new THREE.Mesh(new THREE.BoxGeometry(40,16,1), mat(0xc98d5a,{roughness:0.9})); wall.position.set(0,8,13); wall.receiveShadow=true; g.add(wall);
  const wain = new THREE.Mesh(new THREE.BoxGeometry(40,3.5,1.2), mat(0x6b3a26)); wain.position.set(0,1.75,12.5); g.add(wain);
  const win = new THREE.Mesh(new THREE.BoxGeometry(6,5,0.4), mat(0x9fbfff,{emissive:0x5a7ad0, emissiveIntensity:1.2})); win.position.set(-6,8.5,12.4); g.add(win);
  const bar1 = new THREE.Mesh(new THREE.BoxGeometry(0.3,5,0.6), mat(0x3b2414)); bar1.position.set(-6,8.5,12.2); g.add(bar1);
  const bar2 = new THREE.Mesh(new THREE.BoxGeometry(6,0.3,0.6), mat(0x3b2414)); bar2.position.set(-6,8.5,12.2); g.add(bar2);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.7,20,14), mat(0xffd59a,{emissive:0xffb050, emissiveIntensity:2})); lamp.position.set(5,11,8); g.add(lamp);
  const pl = new THREE.PointLight(0xffb060, 60, 30); pl.position.set(5,10.5,7); scene.add(pl);
  // shelves with jars
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(8,0.3,1.4), mat(0x5a3420)); shelf.position.set(6,6,12); g.add(shelf);
  for(let k=0;k<5;k++){ const j=cyl(0.45,1.2,new THREE.Color().setHSL(k/5,0.6,0.6).getHex(),g); j.position.set(3.2+k*1.4,6.8,12); }
  return {key, hemi, pl};
}

// ---------- hats ----------
function makeHat(type){
  const hat = new THREE.Group();
  if(type==='cowboy'){
    cyl(1.45,0.12,0x8c5a32,hat); const cr=cyl(0.78,0.85,0xa86b3c,hat); cr.position.y=0.45; cr.scale.set(1,1,0.9); cyl(0.8,0.2,0x3b2414,hat).position.y=0.15;
  } else if(type==='party'){
    const cone=add(new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.6,1.5,40),mat(0x4fb3ff)),hat); cone.position.y=0.7;
    for(let i=0;i<3;i++){ const b=add(new THREE.Mesh(new THREE.CylinderGeometry(0.52-i*0.17,0.56-i*0.17,0.14,40),mat(0xffd93c)),hat); b.position.y=0.25+i*0.42; }
    ball(0.2,0xff4fa0,hat).position.y=1.5;
  } else if(type==='crown'){
    const gold=0xffc83c; cyl(0.75,0.35,gold,hat,{metalness:0.7,roughness:0.25}).position.y=0.17;
    for(let i=0;i<6;i++){ const a=i*Math.PI/3; const s=add(new THREE.Mesh(new THREE.ConeGeometry(0.16,0.55,10),mat(gold,{metalness:0.7,roughness:0.25})),hat); s.position.set(Math.sin(a)*0.62,0.6,Math.cos(a)*0.62); ball(0.08,0xff2a5a,hat,{emissive:0xff0040,emissiveIntensity:0.6}).position.set(Math.sin(a)*0.62,0.9,Math.cos(a)*0.62); }
  } else if(type==='pumpkin'){
    ell(0.95,0.8,0.95,0xff8a1c,hat).position.y=0.55; cyl(0.1,0.35,0x3c8a32,hat).position.y=1.4;
    for(const s of [-1,1]){ const e=add(new THREE.Mesh(new THREE.ConeGeometry(0.15,0.25,3),mat(0xffe066,{emissive:0xffc020,emissiveIntensity:1.5})),hat); e.position.set(0.3*s,0.7,-0.86); e.rotation.x=-Math.PI/2; }
  } else if(type==='tophat'){
    cyl(1.0,0.08,0x1d1d24,hat); cyl(0.62,1.15,0x1d1d24,hat).position.y=0.6; cyl(0.63,0.2,0xc81e32,hat).position.y=0.2;
  } else if(type==='halo'){
    const ring=add(new THREE.Mesh(new THREE.TorusGeometry(0.7,0.09,12,40),mat(0xfff08a,{emissive:0xffe060,emissiveIntensity:2})),hat); ring.rotation.x=Math.PI/2; ring.position.y=0.8;
  }
  return hat;
}

// ---------- rat ----------
const PINK=0xff9fb8;
function makeRat(scene, fur, hatType){
  const root = new THREE.Group(); scene.add(root);
  const bodyG = new THREE.Group(); root.add(bodyG);
  const body = ell(1.5,1.25,1.9,fur,bodyG); body.position.set(0,1.45,0.2);
  ell(1.05,0.85,1.3,0xe2dde4,bodyG).position.set(0,1.2,-0.55);
  const head = new THREE.Group(); bodyG.add(head); head.position.set(0,2.55,-1.35);
  ell(1.15,1.0,1.25,fur,head);
  ell(0.7,0.55,0.6,0xe2dde4,head).position.set(0,-0.3,-0.85);
  ball(0.24,0xff6f93,head).position.set(0,-0.15,-1.42);
  const brows=[];
  for(const s of [-1,1]){
    ell(0.2,0.25,0.12,0x111116,head).position.set(0.42*s,0.22,-1.05);
    ball(0.07,0xffffff,head,{emissive:0xffffff,emissiveIntensity:0.6}).position.set(0.42*s+0.06,0.32,-1.14);
    const br=rbox(0.42,0.1,0.1,0x2b2b33,head,0.04); br.position.set(0.42*s,0.55,-1.0); br.rotation.z=-0.3*s; brows.push(br);
    const ear=cyl(0.62,0.12,fur,head); ear.rotation.x=Math.PI/2; ear.position.set(0.85*s,0.85,0.05); ear.rotation.z=0.3*s;
    const inner=cyl(0.42,0.13,PINK,head); inner.rotation.x=Math.PI/2; inner.position.set(0.85*s,0.85,-0.01); inner.rotation.z=0.3*s;
    rbox(0.13,0.2,0.06,0xffffff,head,0.02).position.set(0.075*s,-0.62,-1.22);
    for(const t of [-0.12,0.12]){ const w=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,1.2,6),mat(0xf6f6fa)); w.rotation.z=Math.PI/2+t*s; w.position.set(0.75*s,-0.25+t*0.6,-1.15); head.add(w); }
  }
  const feet=[];
  for(const [x,z,ph] of [[-0.75,-0.6,0],[0.75,-0.6,Math.PI],[-0.85,1.2,Math.PI],[0.85,1.2,0]]){ const f=ell(0.32,0.2,0.42,PINK,root); f.position.set(x,0.2,z); feet.push({m:f,x,z,ph}); }
  const tail=[]; for(let i=0;i<10;i++){ tail.push(ball(0.15-i*0.008,PINK,root)); }
  const hatHolder = new THREE.Group(); head.add(hatHolder); hatHolder.position.set(0.05,0.95,0.05); hatHolder.rotation.set(-0.15,0,0.18);
  let hat=null;
  function setHat(type){ if(hat){ hatHolder.remove(hat); } hat = type ? makeHat(type) : null; if(hat) hatHolder.add(hat); }
  setHat(hatType);
  // анимация: t — время, speed — скорость бега (0..1)
  function animate(t, speed, seed=0){
    const p = t*(6+speed*16) + seed;
    bodyG.position.y = Math.abs(Math.sin(p))*0.25*speed;
    bodyG.rotation.x = Math.sin(p)*0.05*speed;
    head.rotation.x = Math.sin(t*2.3+seed)*0.06 + Math.sin(t*14+seed)*0.03*(1-speed);
    head.rotation.y = Math.sin(t*1.1+seed)*0.25*(1-speed);
    for(const f of feet){ f.m.position.y = 0.2 + Math.max(0,Math.sin(p+f.ph))*0.35*speed; f.m.position.z = f.z + Math.cos(p+f.ph)*0.45*speed; }
    for(let i=0;i<tail.length;i++){
      const u=i/(tail.length-1);
      const wag=Math.sin(t*5+seed-u*2.5)*(0.6+speed*0.6)*u;
      tail[i].position.set(wag*1.2, 1.0 - u*0.7 + Math.sin(u*Math.PI)*0.6, 1.9 + u*2.6);
    }
  }
  return {root, bodyG, head, brows, setHat, animate};
}

// ---------- chef ----------
function makeChef(scene){
  const root = new THREE.Group(); scene.add(root);
  const SKIN=0xffd34d;
  const torso=rbox(2.0,2.0,1.0,0xffffff,root); torso.position.y=3.0;
  for(let i=0;i<3;i++) ball(0.09,0x333333,root).position.set(0.35,3.6-i*0.45,-0.52);
  const legs=[];
  for(const s of [-1,1]){ const lg=new THREE.Group(); root.add(lg); lg.position.set(0.5*s,2.0,0); rbox(0.95,2.0,1.0,0x2e3a66,lg).position.y=-1.0; legs.push(lg); }
  const armL=new THREE.Group(); root.add(armL); armL.position.set(1.5,3.9,0); rbox(0.95,2.0,1.0,SKIN,armL).position.y=-0.9;
  const armR=new THREE.Group(); root.add(armR); armR.position.set(-1.5,3.9,0); rbox(0.95,2.0,1.0,SKIN,armR).position.y=-0.9;
  const head=new THREE.Group(); root.add(head); head.position.y=4.65;
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.65,0.65,1.2,40),mat(SKIN)),head);
  for(const s of [-1,1]){ ell(0.1,0.16,0.06,0x111111,head).position.set(0.25*s,0.12,-0.62); const b=rbox(0.34,0.08,0.06,0x111111,head,0.03); b.position.set(0.25*s,0.38,-0.62); b.rotation.z=0.45*s; const m=ell(0.22,0.08,0.06,0x3a2a1a,head); m.position.set(0.17*s,-0.12,-0.66); m.rotation.z=-0.3*s; }
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(0.22,0.05,8,24,Math.PI),mat(0x111111)); mouth.position.set(0,-0.36,-0.63); head.add(mouth);
  cyl(0.72,0.6,0xffffff,head).position.y=0.85; ell(0.95,0.7,0.95,0xffffff,head).position.y=1.45;
  const net=new THREE.Group(); armR.add(net); net.position.set(0,-1.9,0);
  cyl(0.08,3.6,0x7a4f2a,net).position.y=-1.6;
  const ring=add(new THREE.Mesh(new THREE.TorusGeometry(1.0,0.08,12,40),mat(0x8a8a95,{metalness:0.6,roughness:0.3})),net); ring.position.y=-4.3; ring.rotation.y=Math.PI/2;
  const bag=add(new THREE.Mesh(new THREE.SphereGeometry(1.0,24,16,0,Math.PI*2,0,Math.PI/2),mat(0xffffff,{transparent:true,opacity:0.55,side:THREE.DoubleSide})),net); bag.position.y=-4.3; bag.rotation.z=Math.PI/2; bag.scale.set(1,1.2,1);
  function walk(t, speed){ const p=t*8; legs[0].rotation.x=Math.sin(p)*0.6*speed; legs[1].rotation.x=-Math.sin(p)*0.6*speed; armL.rotation.x=-Math.sin(p)*0.5*speed; root.position.y=Math.abs(Math.sin(p))*0.12*speed; }
  return {root, armR, net, head, walk};
}

// ---------- confetti ----------
function makeConfetti(scene, n, seed){
  const r=rng(seed); const pieces=[];
  const geo=new THREE.BoxGeometry(0.22,0.06,0.32);
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(geo, mat(new THREE.Color().setHSL(r(),0.85,0.58).getHex(),{emissive:0x111111}));
    m.visible=false; scene.add(m);
    const a=r()*Math.PI*2, up=6+r()*10, sp=3+r()*8;
    pieces.push({m, v:new THREE.Vector3(Math.cos(a)*sp, up, Math.sin(a)*sp), w:new THREE.Vector3(r()*12-6,r()*12-6,r()*12-6)});
  }
  function update(t, t0, origin){
    const dt=t-t0;
    for(const p of pieces){
      if(dt<0||dt>2.6){ p.m.visible=false; continue; }
      p.m.visible=true;
      p.m.position.set(origin.x+p.v.x*dt, Math.max(0.05, origin.y+p.v.y*dt-9.8*dt*dt*0.6), origin.z+p.v.z*dt);
      p.m.rotation.set(p.w.x*dt,p.w.y*dt,p.w.z*dt);
    }
  }
  return {update};
}

const NS='http://www.w3.org/2000/svg';
function word(str, x, y, size, fill, rot=0, font=FONT){
  const g=document.createElementNS(NS,'g');
  for(const [dy,col,sw,f] of [[size*0.09,'#2a0d1c',size*0.2,'#2a0d1c'],[0,'#2a0d1c',size*0.2,'#2a0d1c'],[0,null,0,fill]]){
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',0); t.setAttribute('y',dy); t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','middle');
    t.setAttribute('font-family',font); t.setAttribute('font-size',size); t.setAttribute('font-weight','900');
    t.setAttribute('fill',f); if(sw){ t.setAttribute('stroke',col); t.setAttribute('stroke-width',sw); t.setAttribute('stroke-linejoin','round'); }
    t.textContent=str; g.appendChild(t);
  }
  txt.appendChild(g);
  return {g, x, y, rot, set(scale, op, dx=0, dy=0){ g.setAttribute('transform',`translate(${x+dx} ${y+dy}) rotate(${rot}) scale(${scale})`); g.setAttribute('opacity',op); }};
}
function fit(str, base){ const n=[...str].length; return Math.min(base, Math.floor(1700/Math.max(n,1))); }

];

// ================== КАДР ==================
const $=id=>document.getElementById(id);
function cut(t){ for(const c of [3.0,6.5,10.5,13.0,16.0,19.0]){ if(t>=c && t<c+0.3) return 1-(t-c)/0.3; } return 0; }

window.renderFrame = function(t){
  let scene, shake=0;
  $('bg').style.display='none'; $('dark').style.opacity=1;
  $('vig').style.opacity=0; $('chaos').style.opacity=0; $('mg').style.opacity=0;
  if(t<3.0){ // A
    scene=sA; ratA.animate(t,0,0);
    const k=easeInOut(seg(t,0,3));
    cam.position.set(1.5-k*1.0, 3.4-k*0.3, -9.5+k*3.2); cam.lookAt(0,2.6,-0.5);
  } else if(t<6.5){ // B
    scene=sB;
    const run=seg(t,3.0,4.7); const x=9-easeOut(run)*7.2;
    ratB.root.position.set(x,0,1.0); ratB.root.rotation.y=Math.PI/2;
    ratB.animate(t, run<1?1:0, 1);
    if(t>4.7) ratB.root.rotation.y=Math.PI/2 - easeOut(seg(t,4.7,5.0))*1.2;
    const boom=t>=5.0; cake.visible=!boom; splat.visible=boom;
    confB.update(t,5.0,new THREE.Vector3(-2.4,3.2,1.5));
    if(boom && t<5.5){ shake=0.35*(1-(t-5.0)/0.5); }
    cam.position.set(1.0,5.2,-13.5); cam.lookAt(0.3,2.4,1.0);
    $('chaos').style.opacity=seg(t,3.6,3.9);
    const ch = t<5.0 ? 0 : 10+easeOut(seg(t,5.0,5.6))*25;
    $('chaosFill').style.width=ch+'%'; $('chaosTxt').textContent=`${T.chaos}: ${Math.round(ch)}%`;
  } else if(t<10.5){ // C
    scene=sC;
    const enter=seg(t,6.5,8.2); chefC.root.position.set(-11+easeOut(enter)*7.4,0,2.5); chefC.root.rotation.y=-1.2+enter*0.3;
    chefC.walk(t, enter<1?1:0);
    const raise=seg(t,8.0,8.5), swing=seg(t,8.5,8.75);
    chefC.armR.rotation.x = raise*3.0 - swing*1.6; chefC.armR.rotation.z=-0.1; chefC.net.rotation.x = -0.4 - swing*0.6;
    // крыса: стоит, потом уворачивается и убегает
    const dodge=seg(t,8.55,8.95), flee=seg(t,8.95,10.4);
    const rx = 0.5 + easeOut(dodge)*3.2 + flee*8;
    const ry = Math.sin(dodge*Math.PI)*2.2;
    ratC.root.position.set(rx,ry,0.5);
    ratC.root.rotation.y = t<8.55 ? -0.6 : -Math.PI/2;
    ratC.animate(t, t<8.55?0.0:1, 2);
    ratC.brows.forEach((b,i)=>{ b.rotation.z = (i?1:-1)*(t<8.0?-0.3:0.35); });
    if(t>=8.75 && t<9.2) shake=0.3*(1-(t-8.75)/0.45);
    confC.update(t,8.75,new THREE.Vector3(0.5,0.4,0.5));
    cam.position.set(-0.3,6.8,-21.5); cam.lookAt(-0.3,3.8,1.0);
    const beat=Math.pow(Math.max(0,Math.sin((t-6.5)*Math.PI*2*1.6)),8);
    $('vig').style.opacity = seg(t,6.8,7.3)*(0.35+0.55*beat);
  } else if(t<13.0){ // D
    scene=sD; ratD.animate(t,0,3); ratD.root.rotation.y=0.2;
    cam.position.set(0.5,3.2,-8); cam.lookAt(0,2.4,0);
    const pop=backOut(seg(t,10.65,11.0));
    $('mg').style.opacity=seg(t,10.6,10.8); $('mg').style.transform=`scale(${0.6+0.4*pop})`;
    for(let i=0;i<4;i++){
      const s=seg(t,11.1+i*0.38,11.4+i*0.38);
      const y1=155+i*140, y2=155+order.indexOf(i)*140;
      const l=$('w'+i); l.setAttribute('x2',210+s*440); l.setAttribute('y2',y1+(y2-y1)*s);
    }
    $('mgok').setAttribute('opacity',seg(t,12.7,12.85));
  } else if(t<16.0){ // E
    scene=sE;
    const idx=Math.floor((t-13.0)/0.5)%HATS.length;
    if(ratE.cur!==idx){ ratE.setHat(HATS[idx]); ratE.cur=idx; }
    ratE.root.rotation.y = Math.sin((t-13.0)*1.6)*0.75; plate.rotation.y=ratE.root.rotation.y;
    ratE.root.position.y=0.3; ratE.animate(t,0,4);
    const hop=(t-13.0)%0.5; ratE.root.position.y=0.3+Math.max(0,Math.sin(hop/0.5*Math.PI))*0.5;
    confE.update(t, 13.0+Math.floor((t-13.0)/0.5)*0.5, new THREE.Vector3(0,4.5,0));
    cam.position.set(0,4.6,-12.5); cam.lookAt(0,4.0,0);
  } else if(t<19.0){ // F
    scene=sF;
    const pulse=(Math.sin(t*Math.PI*4)+1)/2;
    alarm.intensity = 80+pulse*220; envF.key.intensity = 300;
    sF.background = new THREE.Color().setRGB(0.12+0.25*pulse,0.02,0.04);
    ratsF.forEach((r,i)=>{ r.animate(t,0,i*1.7); const j=Math.max(0,Math.sin(t*Math.PI*4+i*1.3)); r.root.position.y = t>17.8 ? j*1.4 : j*0.3; });
    confF.update(t,17.8,new THREE.Vector3(0,5,1));
    if(t>=17.8 && t<18.3) shake=0.3*(1-(t-17.8)/0.5);
    cam.position.set(0,5.6,-17.5); cam.lookAt(0,3.2,0.8);
    $('chaos').style.opacity=1;
    const ch=60+easeInOut(seg(t,16.1,17.6))*40;
    $('chaosFill').style.width=ch+'%'; $('chaosTxt').textContent=`${T.chaos}: ${Math.round(ch)}%`;
    $('vig').style.opacity = t<17.8 ? 0.25+0.5*pulse : 0;
  } else { // G
    scene=sG; $('bg').style.display='block'; $('dark').style.opacity=0;
    ratG.animate(t,0,5); ratG2.animate(t,0,6);
    const z=easeOut(seg(t,19.0,22));
    cam.position.set(1.0,5.6,-17.5+z*1.5); cam.lookAt(0.2,3.2,1.2);
    $('rays').style.transform=`rotate(${(t-19)*8}deg)`;
  }
  if(shake>0){ cam.position.x+=(Math.sin(t*90)*shake); cam.position.y+=(Math.cos(t*77)*shake); }
  renderer.render(scene,cam);
  for(const [w,tin,tout] of words){
    const a=seg(t,tin,tin+0.32), b=seg(t,tout-0.2,tout);
    if(t<tin || t>tout){ w.set(0,0); continue; }
    const sc=backOut(a)*(1-b*0.4); const wob=Math.sin((t-tin)*3)*0.02;
    w.set(Math.max(0.01,sc+wob), 1-b);
  }
  $('flash').style.opacity = cut(t)*0.85;
};
